spring.application.name=GreenGuard-Web
spring.datasource.url=jdbc:postgresql://localhost:5432/DB_GREENGUARDIAN
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Crea variables de entorno en tu pc para q te lea estos valores

cloudinary.name = {CLOUDINARY_NAME}
cloudinary.key = {CLOUDINARY_KEY}
cloudinary.secret = {CLOUDINARY_SECRET}