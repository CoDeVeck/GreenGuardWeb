<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        
        <!-- Card de Login -->
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-5">
            
            <!-- Logo/Header -->
            <div class="text-center mb-4">
              <div class="mb-3">
                <i class="bi bi-shield-check text-success" style="font-size: 4rem;"></i>
              </div>
              <h2 class="fw-bold text-dark">Green Guard</h2>
              <p class="text-muted">Panel de Administración</p>
            </div>

            <!-- Alerta de Error -->
            <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
              <i class="bi bi-exclamation-triangle me-2"></i>
              {{ errorMessage }}
              <button type="button" class="btn-close" (click)="errorMessage = ''" aria-label="Close"></button>
            </div>

            <!-- Formulario -->
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
              
              <!-- Email -->
              <div class="mb-3">
                <label for="correoUsu" class="form-label fw-semibold">
                  <i class="bi bi-envelope me-2"></i>Correo Electrónico
                </label>
                <input 
                  type="email" 
                  class="form-control form-control-lg"
                  [class.is-invalid]="correoUsu?.invalid && correoUsu?.touched"
                  id="correoUsu" 
                  formControlName="correoUsu"
                  placeholder="admin@greenguard.com">
                <div *ngIf="correoUsu?.invalid && correoUsu?.touched" class="invalid-feedback">
                  <span *ngIf="correoUsu?.errors?.['required']">El correo es requerido</span>
                  <span *ngIf="correoUsu?.errors?.['email']">Ingresa un correo válido</span>
                </div>
              </div>

              <!-- Password -->
              <div class="mb-4">
                <label for="passwordUsu" class="form-label fw-semibold">
                  <i class="bi bi-lock me-2"></i>Contraseña
                </label>
                <div class="input-group">
                  <input 
                    [type]="showPassword ? 'text' : 'password'"
                    class="form-control form-control-lg"
                    [class.is-invalid]="passwordUsu?.invalid && passwordUsu?.touched"
                    id="passwordUsu" 
                    formControlName="passwordUsu"
                    placeholder="••••••••">
                  <button 
                    class="btn btn-outline-secondary" 
                    type="button"
                    (click)="togglePasswordVisibility()">
                    <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                  </button>
                  <div *ngIf="passwordUsu?.invalid && passwordUsu?.touched" class="invalid-feedback d-block">
                    <span *ngIf="passwordUsu?.errors?.['required']">La contraseña es requerida</span>
                    <span *ngIf="passwordUsu?.errors?.['minlength']">Mínimo 6 caracteres</span>
                  </div>
                </div>
              </div>

              <!-- Botón Submit -->
              <button 
                type="submit" 
                class="btn btn-success btn-lg w-100 fw-semibold"
                [disabled]="loading">
                <span *ngIf="!loading">
                  <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                </span>
                <span *ngIf="loading">
                  <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                  Iniciando...
                </span>
              </button>

            </form>

            <!-- Footer -->
            <div class="text-center mt-4">
              <p class="text-muted small mb-0">
                © 2024 Green Guard. Todos los derechos reservados.
              </p>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>
</div>
